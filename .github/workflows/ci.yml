name: CI

on:
    pull_request:
    push:
        branches: [main]

# a newer push to the same PR cancels the older run
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: ${{ matrix.package }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                package: [client, server]
                include:
                    - package: client
                      typecheck: npx tsc -b
                    - package: server
                      typecheck: npm run typecheck
        defaults:
            run:
                working-directory: ${{ matrix.package }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: ${{ matrix.package }}/package-lock.json

            - run: npm ci

            - name: Type-check
              run: ${{ matrix.typecheck }}

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test
