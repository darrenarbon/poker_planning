name: CI

on:
    pull_request:
    push:
        branches: [main]

# a newer push to the same PR cancels the older run
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: ${{ matrix.package }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                package: [ui, api]
        defaults:
            run:
                working-directory: packages/${{ matrix.package }}
        steps:
            - uses: actions/checkout@v4

            # version comes from packageManager in the root package.json
            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile --filter @teamdeck/${{ matrix.package }}

            - name: Type-check
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test
